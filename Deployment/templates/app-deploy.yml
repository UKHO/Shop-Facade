parameters:
- name: Environment
  type: string
- name: AzureSubscription
  type: string
- name: ContinueEvenIfResourcesAreGettingDestroyed
  type: boolean
  default: false
- name: Container
  type: string
- name: RunTests
  type: boolean
  default: false
- name: RunAddsTests
  type: string
  default: 'skip'
  values:
  - 'skip'
  - 'vNextIAT'
  - 'IAT'
- name: AgentPoolNameApp
  type: string
  default: "Mare Nectaris"
- name: AgentPoolNameHealthCheck
  type: string
  default: "Azure-UKHO-Engineering"
- name: AgentPoolDemandsHealthCheck
  type: string
  default: "ImageOverride -equals ubuntu-latest"

jobs:
- deployment: DeployTerraform
  displayName: "${{parameters.Environment}} - Deploy Terraform"
  environment: "ShopFacade-${{parameters.Environment}}"
  pool:
    name: ${{parameters.AgentPoolNameApp}}
  container: ${{parameters.Container}}
  workspace:
    clean: all
  strategy:
          runOnce:
            deploy:
              steps:
                - template: continuous-deployment.yml
                  parameters:
                    ContinueEvenIfResourcesAreGettingDestroyed: ${{ parameters.ContinueEvenIfResourcesAreGettingDestroyed }}
                    AzureSubscription: ${{parameters.AzureSubscription}}
                       
- deployment: DeployApp
  dependsOn: DeployTerraform
  displayName: "${{parameters.Environment}} - Deploy Dotnet App"
  environment: "ShopFacade-${{parameters.Environment}}"
  pool:
    name: ${{parameters.AgentPoolNameApp}}
  container: ${{parameters.Container}}
  workspace:
   clean: all
  variables:
    - name  : WEB_APP_NAME
      value : $[ dependencies.DevDeployTerraform.outputs['DevDeployTerraform.TerraformDeploy.WEB_APP_NAME'] ]
    - name  : ResourceGroup
      value : $[ dependencies.DevDeployTerraform.outputs['DevDeployTerraform.TerraformDeploy.ResourceGroup'] ]
    - name  : WEB_APP_SLOT_NAME
      value : $[ dependencies.DevDeployTerraform.outputs['DevDeployTerraform.TerraformDeploy.WEB_APP_SLOT_NAME'] ]
    - name  : WEB_APP_SLOT_HOST_NAME
      value : $[ dependencies.DevDeployTerraform.outputs['DevDeployTerraform.TerraformDeploy.WEB_APP_SLOT_HOST_NAME'] ]
    - name  : ADDS_MOCK_WEB_APP_NAME
      value : $[ dependencies.DevDeployTerraform.outputs['DevDeployTerraform.TerraformDeploy.ADDS_MOCK_WEB_APP_NAME'] ]
  strategy:
    runOnce:
      deploy:
        steps:
          - checkout: self
            submodules: recursive
          - template: continuous-deployment-app.yml
            parameters:
              AzureSubscription: ${{parameters.AzureSubscription}}

- deployment: HealthCheck
  dependsOn:  DeployApp
  displayName: "${{parameters.Environment}} - Health Check & Slot Swap"
  environment: "ShopFacade-${{parameters.Environment}}"
  pool:
    name: ${{parameters.AgentPoolNameHealthCheck}}
    demands: ${{parameters.AgentPoolDemandsHealthCheck}}
  workspace:
   clean: all
  variables:
    - name  : WEB_APP_NAME
      value : $[ dependencies.DevDeployTerraform.outputs['DevDeployTerraform.TerraformDeploy.WEB_APP_NAME'] ]
    - name  : ResourceGroup
      value : $[ dependencies.DevDeployTerraform.outputs['DevDeployTerraform.TerraformDeploy.ResourceGroup'] ]
    - name  : WEB_APP_SLOT_NAME
      value : $[ dependencies.DevDeployTerraform.outputs['DevDeployTerraform.TerraformDeploy.WEB_APP_SLOT_NAME'] ]
    - name  : WEB_APP_SLOT_HOST_NAME
      value : $[ dependencies.DevDeployTerraform.outputs['DevDeployTerraform.TerraformDeploy.WEB_APP_SLOT_HOST_NAME'] ]
  strategy:
    runOnce:
      deploy:
        steps:
          - template: health-check.yml
            parameters:
              AzureSubscription: ${{parameters.AzureSubscription}}

- deployment: FunctionalTests
  dependsOn:  HealthCheck
  displayName: "${{parameters.Environment}} - Functional Automated Tests"
  environment: "ShopFacade-${{parameters.Environment}}"
  pool:
    name: ${{parameters.AgentPoolNameApp}}
  container: ${{parameters.Container}}
  condition: and(succeeded('HealthCheck'), eq( ${{parameters.RunTests}} , 'true'))
  workspace:
   clean: all
  strategy:
    runOnce:
      deploy:
        steps:
          - checkout: self
            submodules: recursive
          - template: continuous-testing.yml
            parameters:
              AzureSubscription: ${{parameters.AzureSubscription}}

- ${{ if ne(parameters.RunAddsTests, 'skip') }}:
  - template:  template.yml@TriggerADDSAutoTestsPipeline
    parameters:
      serviceConnection: 'addse2eauto Test - A.011.13'
      environment: ${{ parameters.RunAddsTests }}
      dependsOn:
      - DeployApp
