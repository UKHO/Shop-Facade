parameters:
  - name: AzureSubscription
    type: string

steps:
  - task: PowerShell@2
    displayName: "Verify agent can reach staging slot endpoint"
    inputs:
      targetType: filePath
      filePath: "$(Pipeline.Workspace)/terraformartifact/test_network_connectivity.ps1"
      arguments: "-targetUrl $(WEB_APP_SLOT_HOST_NAME)"

  - task: PowerShell@2
    displayName: "Check the status of staging slot"
    inputs:
      targetType: filePath
      filePath: "$(Pipeline.Workspace)/terraformartifact/check_service_status.ps1"
      arguments: "-healthEndPointUrl https://$(WEB_APP_SLOT_HOST_NAME)/health -waitTimeInMinute $(waitTimeInMinute)"

  - task: AzureAppServiceManage@0
    displayName: "Swap with production slot"
    inputs:
      azureSubscription: "${{ parameters.AzureSubscription }}"
      resourceGroupName: $(ResourceGroup)
      webAppName: $(WEB_APP_NAME)
      action: "Swap Slots"
      swapWithProduction: true
      sourceSlot: $(WEB_APP_SLOT_NAME)

  - task: PowerShell@2
    displayName: "Verify agent can reach production endpoint"
    inputs:
      targetType: filePath
      filePath: "$(Pipeline.Workspace)/terraformartifact/test_network_connectivity.ps1"
      arguments: "-targetUrl $(ShopFacadeConfiguration.BaseUrl)"

  - task: PowerShell@2
    displayName: "Check the status of production slot"
    inputs:
      targetType: filePath
      filePath: "$(Pipeline.Workspace)/terraformartifact/check_service_status.ps1"
      arguments: "-healthEndPointUrl $(ShopFacadeConfiguration.BaseUrl)/health -waitTimeInMinute $(waitTimeInMinute)"
